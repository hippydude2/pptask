name: Collaborative Workflow

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update_html_and_readme:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Update index.html
      - name: Update HTML
        env:
          ACTOR: ${{ github.actor }}
        run: |
          echo "GitHub Actor: $ACTOR"

          if [ "$ACTOR" = "hippydude2" ]; then
            ROLE="Team Leader"
          elif [ "$ACTOR" = "member1" ]; then
            ROLE="Member 1"
          elif [ "$ACTOR" = "member2" ]; then
            ROLE="Member 2"
          else
            ROLE="Unknown Member"
          fi

          sed -i '/<\/body>/i <p>Updated by '"$ROLE"' on '"$(date)"'</p>' index.html


      # Step 3: Update README
      - name: Update README
        env:
          ACTOR: ${{ github.actor }}
        run: |
          echo "### Updated by $ACTOR on $(date '+%Y-%m-%d %H:%M:%S') [Commit: $(git rev-parse --short HEAD)]" >> README.md


      # Step 4: Commit Changes to index.html and README
      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html README.md

          if ! git diff --cached --quiet; then
            git commit -m "Workflow: Updated HTML and README for ${{ github.actor }}"
            git push origin HEAD:main
          else
            echo "No changes to commit"
          fi

